apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-imagemagick-policy
  namespace: dms
data:
  policy.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE policymap [
      <!ELEMENT policymap (policy)*>
      <!ATTLIST policymap xmlns CDATA #FIXED "">
      <!ELEMENT policy EMPTY>
      <!ATTLIST policy xmlns CDATA #FIXED "" domain NMTOKEN #REQUIRED
        name NMTOKEN #IMPLIED pattern CDATA #IMPLIED rights NMTOKEN #IMPLIED
        stealth NMTOKEN #IMPLIED value CDATA #IMPLIED>
    ]>
    <policymap>
      <!-- Default deny all coders/modules/delegates, then allow only JPEG. -->
      <policy domain="coder" rights="none" pattern="*" />
      <policy domain="module" rights="none" pattern="*" />
      <policy domain="delegate" rights="none" pattern="*" />
      <policy domain="path" rights="none" pattern="@*" />

      <policy domain="module" rights="read|write" pattern="JPEG" />
      <policy domain="coder" rights="read|write" pattern="JPEG" />

      <!-- Guardrails against decompression bombs and expensive transforms. -->
      <policy domain="resource" name="memory" value="256MiB" />
      <policy domain="resource" name="map" value="256MiB" />
      <policy domain="resource" name="disk" value="1GiB" />
      <policy domain="resource" name="time" value="30" />
      <policy domain="resource" name="thread" value="2" />
      <policy domain="resource" name="width" value="8000" />
      <policy domain="resource" name="height" value="8000" />
      <policy domain="resource" name="area" value="64MP" />
      <policy domain="resource" name="list-length" value="8" />
    </policymap>
